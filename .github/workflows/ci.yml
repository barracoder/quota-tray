name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            shell: pwsh
          - os: windows-latest
            rid: win-arm64
            shell: pwsh
          - os: macos-latest
            rid: osx-arm64
            shell: bash
          - os: macos-latest
            rid: osx-x64
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The build scripts are maintained in both shells; Windows exercises the .ps1, macOS the .sh.
      - name: Build and test (PowerShell)
        if: matrix.shell == 'pwsh'
        run: ./scripts/build.ps1
      - name: Build and test (bash)
        if: matrix.shell == 'bash'
        run: ./scripts/build.sh

      - name: Publish (PowerShell)
        if: matrix.shell == 'pwsh'
        run: ./scripts/publish.ps1 -Rid ${{ matrix.rid }}
      - name: Publish (bash)
        if: matrix.shell == 'bash'
        run: ./scripts/publish.sh ${{ matrix.rid }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/${{ matrix.rid }}
          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            ditto -c -k --sequesterRsrc --keepParent QuotaTray.app "quota-tray-${{ matrix.rid }}.zip"
          else
            7z a -tzip "quota-tray-${{ matrix.rid }}.zip" ./publish/*
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quota-tray-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/quota-tray-${{ matrix.rid }}.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.rid }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: ignore

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: quota-tray-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.zip
          generate_release_notes: true
